name: release

# 说明：本仓库的 Release 由维护者手动发布（网页操作）。
# 这个工作流只保留手动触发，不做自动发版，避免与手动发布的附件冲突。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure gradlew is executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Decode keystore and write keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KS_PASSWORD"
              echo "keyAlias=$KS_KEY_ALIAS"
              echo "keyPassword=$KS_KEY_PASSWORD"
            } > android/keystore.properties
            echo "keystore + keystore.properties ready"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，将产出未签名包（不可发布）"
          fi

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --print-certs "$APK" && echo "signature OK"
          else
            echo "::warning::apksigner 不可用，跳过签名校验"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: javboss-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error