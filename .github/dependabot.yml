version: 2
updates:
  # Android 依赖：只接受 minor / patch，忽略 major（跨大版本会导致编译失败或行为变化）
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [ dependencies ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      minor-and-patch:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # GitHub Actions：同样只接受 minor / patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ ci ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]